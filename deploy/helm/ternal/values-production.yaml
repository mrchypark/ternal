transport:
  managedRelay:
    enabled: true
    replicas: 1
    image:
      repository: n0computer/iroh-relay
      tag: v1.1.0
      digest: sha256:7805aaf67ca59e04cd54999d142c85ed72e38e5bd4515c902fa5c8d838674747
      pullPolicy: IfNotPresent
    pdb:
      # A one-replica minAvailable=1 PDB blocks voluntary maintenance.
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 120
    preStopDelaySeconds: 60
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    access:
      enabled: true
      path: /internal/iroh-relay/access
    # Provider-specific backend policies are opt-in.
    gcpBackendPolicy:
      enabled: false
      timeoutSec: 86400
      connectionDraining:
        drainingTimeoutSec: 300

data:
  # Production must supply data.clusterID, data.objectStore metadata,
  # data.trustAnchorConfigMap and an existing serviceAccountName.
  # Rhiza-certified object storage is authoritative; /data remains emptyDir.
  requireObjectStore: true
