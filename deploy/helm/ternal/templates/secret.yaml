{{- $existingSecret := .Values.secrets.existingSecret | default "" -}}
{{- $inlineSecrets := or .Values.secrets.oidcClientSecret .Values.secrets.sessionKey .Values.secrets.dataAdminToken .Values.secrets.relayAccessToken -}}
{{- if and $existingSecret $inlineSecrets -}}
{{- fail "secrets.existingSecret cannot be combined with inline secret values" -}}
{{- end -}}
{{- if not $existingSecret -}}
{{- $sessionKey := required "secrets.sessionKey is required" .Values.secrets.sessionKey -}}
{{- if lt (len $sessionKey) 32 -}}
{{- fail "secrets.sessionKey must be at least 32 characters" -}}
{{- end -}}
{{- $managedRelay := default dict .Values.transport.managedRelay -}}
{{- $relayAccessToken := .Values.secrets.relayAccessToken | default "" -}}
{{- if ($managedRelay.enabled | default false) -}}
{{- $relayAccessToken = required "secrets.relayAccessToken is required when managed relay is enabled" $relayAccessToken -}}
{{- if lt (len $relayAccessToken) 32 -}}
{{- fail "secrets.relayAccessToken must be at least 32 characters" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  TERNAL_OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret is required" .Values.secrets.oidcClientSecret | quote }}
  TERNAL_SESSION_KEY: {{ $sessionKey | quote }}
  TERNAL_DATA_ADMIN_TOKEN: {{ required "secrets.dataAdminToken is required" .Values.secrets.dataAdminToken | quote }}
  {{- if ($managedRelay.enabled | default false) }}
  TERNAL_RELAY_ACCESS_TOKEN: {{ $relayAccessToken | quote }}
  {{- end }}
{{- end }}
