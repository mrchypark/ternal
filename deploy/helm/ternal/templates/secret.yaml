{{- $existingSecret := .Values.secrets.existingSecret | default "" -}}
{{- $inlineSecrets := or .Values.secrets.rauthyClientSecret .Values.secrets.sessionKey .Values.secrets.rhizaAdminToken .Values.secrets.pigeonsRelayAccessToken -}}
{{- if and $existingSecret $inlineSecrets -}}
{{- fail "secrets.existingSecret cannot be combined with inline secret values" -}}
{{- end -}}
{{- if not $existingSecret -}}
{{- $sessionKey := required "secrets.sessionKey is required" .Values.secrets.sessionKey -}}
{{- if lt (len $sessionKey) 32 -}}
{{- fail "secrets.sessionKey must be at least 32 characters" -}}
{{- end -}}
{{- $managedRelay := default dict .Values.pigeons.managedRelay -}}
{{- $relayAccessToken := .Values.secrets.pigeonsRelayAccessToken | default "" -}}
{{- if ($managedRelay.enabled | default false) -}}
{{- $relayAccessToken = required "secrets.pigeonsRelayAccessToken is required when managed relay is enabled" $relayAccessToken -}}
{{- if lt (len $relayAccessToken) 32 -}}
{{- fail "secrets.pigeonsRelayAccessToken must be at least 32 characters" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  RAUTHY_CLIENT_SECRET: {{ required "secrets.rauthyClientSecret is required" .Values.secrets.rauthyClientSecret | quote }}
  TERNAL_SESSION_KEY: {{ $sessionKey | quote }}
  RHIZA_ADMIN_TOKEN: {{ required "secrets.rhizaAdminToken is required" .Values.secrets.rhizaAdminToken | quote }}
  {{- if ($managedRelay.enabled | default false) }}
  TERNAL_PIGEONS_RELAY_ACCESS_TOKEN: {{ $relayAccessToken | quote }}
  {{- end }}
{{- end }}
