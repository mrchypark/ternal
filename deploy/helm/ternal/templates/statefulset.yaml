{{- $imageTag := default "" .Values.image.tag -}}
{{- $imageDigest := default "" .Values.image.digest -}}
{{- if $imageDigest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $imageDigest) -}}
{{- fail "image.digest must be a sha256 digest" -}}
{{- end -}}
{{- else -}}
{{- $imageTag = required "image.tag is required" $imageTag -}}
{{- end -}}
{{- $secretName := .Values.secrets.existingSecret | default .Release.Name -}}
{{- $managedRelay := default dict .Values.transport.managedRelay -}}
{{- $data := default dict .Values.data -}}
{{- $dataMode := default "standalone" $data.mode -}}
{{- $haMode := eq $dataMode "ha" -}}
{{- $localMode := eq $dataMode "local" -}}
{{- $local := default dict $data.local -}}
{{- $ha := default dict $data.ha -}}
{{- $trustAnchor := default "" $data.trustAnchorConfigMap -}}
{{- $operator := default dict .Values.operator -}}
{{- $operatorEnabled := $operator.enabled | default false -}}
{{- $dataIdentity := include "ternal.dataIdentity" . -}}
{{- with (lookup "apps/v1" "StatefulSet" .Release.Namespace .Release.Name) -}}
{{- $currentIdentity := index .spec.selector.matchLabels "ternal.dev/data-identity" -}}
{{- if ne (default "" $currentIdentity) $dataIdentity -}}
{{- fail "data mode, cluster identity, membership, and object storage are immutable; create a new Helm release for a greenfield cluster" -}}
{{- end -}}
{{- end -}}
{{- if and (not $imageDigest) (eq $imageTag "latest") -}}
{{- fail "image.tag must not be latest; use an immutable build tag" -}}
{{- end -}}
{{- if .Values.persistence.enabled -}}
{{- fail "PVC persistence is unsupported; use Rhiza object storage and keep persistence.enabled=false" -}}
{{- end -}}
{{- if and $haMode (not .Values.secrets.existingSecret) -}}
{{- fail "data.mode=ha requires secrets.existingSecret with TERNAL_DATA_CLUSTER_MEMBERS" -}}
{{- end -}}
{{- if and $operatorEnabled (not $haMode) -}}
{{- fail "operator.enabled requires data.mode=ha" -}}
{{- end -}}
{{- if $operator.automaticRecovery -}}
{{- fail "operator.automaticRecovery is not supported in this release" -}}
{{- end -}}
{{- if $localMode -}}
{{- if not $imageDigest -}}
{{- fail "data.mode=local requires an approved immutable image.digest" -}}
{{- end -}}
{{- if or $operatorEnabled ((default dict .Values.anchor).enabled | default false) -}}
{{- fail "data.mode=local requires operator.enabled=false and anchor.enabled=false" -}}
{{- end -}}
{{- if ne (int $local.replicas) 1 -}}
{{- fail "data.mode=local requires data.local.replicas=1" -}}
{{- end -}}
{{- if not (and (kindIs "bool" $local.writerGCQuiescenceAcknowledged) $local.writerGCQuiescenceAcknowledged) -}}
{{- fail "data.mode=local requires explicit data.local.writerGCQuiescenceAcknowledged=true; acknowledgement is not fencing proof" -}}
{{- end -}}
{{- if ne (required "data.local.preflightReceiptFile is required" $local.preflightReceiptFile) "/staging/preflight.json" -}}
{{- fail "data.local.preflightReceiptFile must be /staging/preflight.json" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ ternary (printf "%s-data" .Release.Name) .Release.Name $haMode }}
  replicas: {{ ternary 3 1 $haMode }}
  {{- if $haMode }}
  podManagementPolicy: Parallel
  {{- end }}
  {{- if or $haMode $localMode }}
  updateStrategy:
    type: OnDelete
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      ternal.dev/data-identity: {{ $dataIdentity }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.secrets.version }}
        ternal.dev/secret-version: {{ . | quote }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        ternal.dev/data-identity: {{ $dataIdentity }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- if $trustAnchor }}
      automountServiceAccountToken: true
      {{- end }}
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if and $haMode (not (hasKey .Values "affinity")) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Chart.Name }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $localMode }}
      initContainers:
        - name: ternal-local-restore
          image: "{{ .Values.image.repository }}{{ if $imageDigest }}@{{ $imageDigest }}{{ else }}:{{ $imageTag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/ternal-api"]
          args: ["local-restore"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            {{- include "ternal.localDataEnv" . | nindent 12 }}
            {{- range $key := list "TERNAL_OBJECT_STORE_ACCESS_KEY" "TERNAL_OBJECT_STORE_SECRET_KEY" "TERNAL_OBJECT_STORE_SESSION_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: local-staging
              mountPath: /staging
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: ternal-api
          image: "{{ .Values.image.repository }}{{ if $imageDigest }}@{{ $imageDigest }}{{ else }}:{{ $imageTag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            {{- if $localMode }}
            runAsGroup: 65532
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
{{ if $haMode }}
            - name: data-peer
              containerPort: {{ default 9090 $ha.peerPort }}
              protocol: UDP
{{ end }}
{{ if ($managedRelay.enabled | default false) }}
            - name: relay-access
              containerPort: 3001
{{ end }}
{{ if $operatorEnabled }}
            - name: recovery
              containerPort: {{ default 9091 $data.ha.operatorPort }}
{{ end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
          envFrom:
            - configMapRef:
                name: {{ include "ternal.dataConfigMapName" . }}
            - secretRef:
                name: {{ $secretName }}
          {{- if or $haMode $trustAnchor $operatorEnabled $localMode }}
          env:
            {{- if $localMode }}
            {{- include "ternal.localDataEnv" . | nindent 12 }}
            - name: TERNAL_REQUIRE_DATA_ADMIN_TOKEN
              value: "0"
            - name: TERNAL_OPERATOR_BIND
              value: ""
            {{- else if $trustAnchor }}
            - name: TERNAL_TRUST_ANCHOR_CONFIGMAP
              value: {{ $trustAnchor | quote }}
            - name: TERNAL_TRUST_ANCHOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- if $haMode }}
            - name: TERNAL_DATA_MULTI_NODE
              value: "1"
            - name: TERNAL_DATA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TERNAL_DATA_EXPECTED_MEMBER_IDS
              value: {{ printf "%s-0,%s-1,%s-2" .Release.Name .Release.Name .Release.Name | quote }}
            - name: TERNAL_DATA_BIND_ADDR
              value: {{ printf "0.0.0.0:%d" (int (default 9090 $ha.peerPort)) | quote }}
            - name: TERNAL_DATA_PEER_ADDR
              value: {{ printf "0.0.0.0:%d" (int (default 9090 $ha.peerPort)) | quote }}
            - name: TERNAL_DATA_CLUSTER_MEMBERS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: TERNAL_DATA_CLUSTER_MEMBERS
            {{- end }}
            {{- if $operatorEnabled }}
            - name: TERNAL_OPERATOR_BIND
              value: {{ printf "0.0.0.0:%d" (int (default 9091 $data.ha.operatorPort)) | quote }}
            {{- include "ternal.operatorEnv" . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if $localMode }}
            - name: local-staging
              mountPath: /staging
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        {{- if $localMode }}
        - name: local-staging
          emptyDir:
            sizeLimit: {{ required "data.local.stagingSizeLimit is required" $local.stagingSizeLimit }}
        {{- end }}
