image:
  repository: ternal
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Existing Kubernetes ServiceAccount used by the API pods. On GKE, bind this
# account through Workload Identity instead of supplying a service-account key.
serviceAccountName: ""

service:
  port: 3000

persistence:
  # PVC-backed /data is intentionally unsupported. Keep false so accidental
  # reuse of the retired setting fails closed during rendering.
  enabled: false

data:
  # standalone runs one embedded Rhiza voter. ha runs exactly three voters.
  mode: standalone
  # Production sets this true. HA implies it. When false, standalone is an
  # explicitly ephemeral development mode.
  requireObjectStore: false
  # Must match the binary; changes require a new greenfield data identity.
  schemaVersion: 1
  # Durable standalone and HA require a unique, stable lowercase DNS label.
  clusterID: ""
  checkpointInterval: 15m
  objectStore:
    # Rhiza-certified S3-compatible or native GCS storage is the persistence
    # authority. /data is always a disposable emptyDir cache.
    provider: ""
    endpoint: ""
    bucket: ""
    # Empty defaults to clusters/<clusterID>.
    prefix: ""
    region: ""
    insecure: false
    durability: before-ack
  ha:
    peerPort: 9090

gateway:
  enabled: false
  scheme: https
  host: ""
  parentRef:
    name: ""
    namespace: ""
    port: null
    sectionName: ""

oidc:
  issuer: http://host.docker.internal:8080/auth/v1/
  clientId: ternal
  redirectUrl: http://127.0.0.1:3000/auth/callback
  adminGroup: ternal-admins
  groupsClaim: groups

session:
  ttlSeconds: 3600

transport:
  relayUrls: ""
  extraRelayUrls: ""
  managedRelay:
    enabled: false
    replicas: 1
    image:
      repository: n0computer/iroh-relay
      tag: v0.96.1
      digest: ""
      pullPolicy: IfNotPresent
    port: 3340
    servicePort: 3340
    metrics:
      enabled: true
      port: 9090
    pdb:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 120
    preStopDelaySeconds: 60
    service:
      annotations: {}
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    resources: {}
    access:
      enabled: false
      path: /internal/iroh-relay/access
    gcpBackendPolicy:
      enabled: false
      timeoutSec: 86400
      connectionDraining:
        drainingTimeoutSec: 300

devHeaders: false

secrets:
  # Set this to a pre-created Secret containing the four environment-variable
  # keys below. This keeps plaintext values out of Helm release history.
  existingSecret: ""
  oidcClientSecret: ""
  sessionKey: ""
  dataAdminToken: ""
  relayAccessToken: ""
