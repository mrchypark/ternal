services:
  api:
    build: .
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      TERNAL_BIND: 0.0.0.0:3000
      TERNAL_OIDC_ISSUER: ${TERNAL_OIDC_ISSUER:?set TERNAL_OIDC_ISSUER in .env}
      TERNAL_OIDC_CLIENT_ID: ${TERNAL_OIDC_CLIENT_ID:?set TERNAL_OIDC_CLIENT_ID in .env}
      TERNAL_OIDC_CLIENT_SECRET: ${TERNAL_OIDC_CLIENT_SECRET:?set TERNAL_OIDC_CLIENT_SECRET in .env}
      TERNAL_OIDC_REDIRECT_URL: ${TERNAL_OIDC_REDIRECT_URL:?set TERNAL_OIDC_REDIRECT_URL in .env}
      TERNAL_OIDC_ADMIN_GROUP: ${TERNAL_OIDC_ADMIN_GROUP:-ternal-admins}
      TERNAL_OIDC_GROUPS_CLAIM: ${TERNAL_OIDC_GROUPS_CLAIM:-groups}
      TERNAL_SESSION_KEY: ${TERNAL_SESSION_KEY:?set TERNAL_SESSION_KEY in .env}
      TERNAL_DATA_ADMIN_TOKEN: ${TERNAL_DATA_ADMIN_TOKEN:?set TERNAL_DATA_ADMIN_TOKEN in .env}
      TERNAL_REQUIRE_DATA_ADMIN_TOKEN: "1"
      TERNAL_RELAY_ACCESS_TOKEN: ${TERNAL_RELAY_ACCESS_TOKEN:?set TERNAL_RELAY_ACCESS_TOKEN in .env}
      TERNAL_SESSION_TTL_SECONDS: 3600
      TERNAL_DEV_HEADERS: "0"
      TERNAL_AGENT_RELAY_URLS: ${TERNAL_AGENT_RELAY_URLS:-}
      TERNAL_AGENT_EXTRA_RELAY_URLS: ${TERNAL_AGENT_EXTRA_RELAY_URLS:-}
    volumes:
      - ternal-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  ternal-data:
