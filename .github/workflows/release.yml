name: Tag release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/mrchypark/ternal

jobs:
  native:
    uses: ./.github/workflows/native-release-assets.yml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned verification tools
        run: |
          install -d "$RUNNER_TEMP/ternal-tools"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ternal-tools/helm.tar.gz" \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  $RUNNER_TEMP/ternal-tools/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/ternal-tools/helm.tar.gz" \
            -C "$RUNNER_TEMP/ternal-tools" --strip-components=1 linux-amd64/helm
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ternal-tools/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  $RUNNER_TEMP/ternal-tools/yq" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/ternal-tools/helm" "$RUNNER_TEMP/ternal-tools/yq"
          echo "$RUNNER_TEMP/ternal-tools" >> "$GITHUB_PATH"

      - name: Verify tag before publishing
        run: |
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          ./frontend/build.sh
          git diff --exit-code -- internal/web/static
          test -z "$(gofmt -l cmd internal)"
          go test -race -count=1 -timeout=10m ./...
          go vet ./...
          python3 deploy/release/tag-release-workflow.test.py
          sh deploy/vind/helm-render-check.sh

      - name: Package Helm chart
        run: |
          version=${GITHUB_REF_NAME#v}
          chart="dist/release/ternal-$version.tgz"
          mkdir -p dist/release
          helm package deploy/helm/ternal \
            --destination dist/release \
            --version "$version" \
            --app-version "$version"
          test -f "$chart"
          test "$(helm show chart "$chart" | awk '/^version:/ { print $2 }')" = "$version"
          test "$(helm show chart "$chart" | awk '/^appVersion:/ { gsub(/\"/, "", $2); print $2 }')" = "$version"
          sha256sum "$chart" > helm-chart-sha256.txt

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push release image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mrchypark/ternal
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Scan exact digest and create SPDX SBOMs
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "$DIGEST" > image-digest.txt
          for arch in amd64 arm64; do
            docker run --rm \
              -e DOCKER_CONFIG=/auth \
              -v "$HOME/.docker/config.json:/auth/config.json:ro" \
              anchore/grype:v0.104.1@sha256:e7d3cb36d2ebfb522141d83a5d0df9cda301f7e9f8747ee4af41f12c478fa77c \
              "$IMAGE_NAME@$DIGEST" --platform "linux/$arch" --fail-on high
            docker run --rm \
              -e DOCKER_CONFIG=/auth \
              -v "$HOME/.docker/config.json:/auth/config.json:ro" \
              anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
              "$IMAGE_NAME@$DIGEST" --platform "linux/$arch" -o spdx-json > "sbom-$arch.spdx.json"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign and verify exact digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          cosign sign --yes "$IMAGE_NAME@$DIGEST"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_NAME@$DIGEST" > signature-verification.json

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            image-digest.txt
            helm-chart-sha256.txt
            dist/release/ternal-*.tgz
            sbom-amd64.spdx.json
            sbom-arm64.spdx.json
            signature-verification.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified GitHub Release
    needs:
      - native
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download image and chart metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: staged/release

      - name: Download Linux agent archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternal-agent-linux-amd64
          path: staged/native

      - name: Download Linux amd64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-linux-amd64
          path: staged/native

      - name: Download Linux arm64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-linux-arm64
          path: staged/native

      - name: Download macOS amd64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-macos-amd64
          path: staged/native

      - name: Download macOS arm64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-macos-arm64
          path: staged/native

      - name: Download Windows amd64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-windows-amd64
          path: staged/native

      - name: Download Windows arm64 CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-windows-arm64
          path: staged/native

      - name: Bind and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=${GITHUB_REF_NAME#v}
          mkdir release
          cp staged/release/image-digest.txt release/
          cp staged/release/helm-chart-sha256.txt release/
          cp staged/release/sbom-amd64.spdx.json release/
          cp staged/release/sbom-arm64.spdx.json release/
          cp staged/release/signature-verification.json release/
          cp "staged/release/dist/release/ternal-$version.tgz" release/
          cp staged/native/* release/
          expected='helm-chart-sha256.txt
          image-digest.txt
          sbom-amd64.spdx.json
          sbom-arm64.spdx.json
          signature-verification.json
          ternal-'"$version"'.tgz
          ternal-agent-linux-amd64.tar.gz
          ternalctl-linux-amd64.tar.gz
          ternalctl-linux-arm64.tar.gz
          ternalctl-macos-amd64.tar.gz
          ternalctl-macos-arm64.tar.gz
          ternalctl-windows-amd64.zip
          ternalctl-windows-arm64.zip'
          actual=$(find release -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual" = "$expected"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          release = pathlib.Path("release")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          chart = release / f"ternal-{version}.tgz"
          image_digest = (release / "image-digest.txt").read_text().strip()
          if re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest) is None:
              raise SystemExit("invalid image digest")
          recorded_chart = (release / "helm-chart-sha256.txt").read_text().split()
          chart_digest = hashlib.sha256(chart.read_bytes()).hexdigest()
          if recorded_chart != [chart_digest, f"dist/release/{chart.name}"]:
              raise SystemExit("Helm chart digest record does not match the release asset")
          build = dict(
              line.split("=", 1)
              for line in pathlib.Path("deploy/agent/pigeons-build.env").read_text().splitlines()
              if line and not line.startswith("#")
          )
          assets = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(release.iterdir())
              if path.is_file()
          }
          provenance = {
              "schema": "ternal-go-release-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "tag": tag,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}@{image_digest}",
              "pigeons_version": build["PIGEONS_VERSION"],
              "pigeons_commit": build["PIGEONS_COMMIT"],
              "pigeons_source_sha256": build["PIGEONS_SOURCE_SHA256"],
              "pigeons_patch_sha256": hashlib.sha256(
                  pathlib.Path(f"deploy/agent/pigeons-{build['PIGEONS_VERSION']}-ternal.patch").read_bytes()
              ).hexdigest(),
              "assets": assets,
          }
          (release / "release-provenance.json").write_text(
              json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n"
          )
          checksums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(release.iterdir())
              if path.is_file()
          }
          (release / "release-sha256.txt").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in checksums.items())
          )
          PY
          for archive in release/ternalctl-*.tar.gz; do
            tar -tzf "$archive" | grep -E '/ternalctl$' >/dev/null
            tar -tzf "$archive" | grep -E '/pigeons$' >/dev/null
          done
          for archive in release/ternalctl-*.zip; do
            unzip -Z1 "$archive" | grep -E '/ternalctl\.exe$' >/dev/null
            unzip -Z1 "$archive" | grep -E '/pigeons\.exe$' >/dev/null
          done
          tar -tzf release/ternal-agent-linux-amd64.tar.gz | grep -E '/ternal-agent$' >/dev/null
          tar -tzf release/ternal-agent-linux-amd64.tar.gz | grep -E '/pigeons$' >/dev/null

      - name: Create, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release.json"
          expected='helm-chart-sha256.txt
          image-digest.txt
          release-provenance.json
          release-sha256.txt
          sbom-amd64.spdx.json
          sbom-arm64.spdx.json
          signature-verification.json
          ternal-'"${GITHUB_REF_NAME#v}"'.tgz
          ternal-agent-linux-amd64.tar.gz
          ternalctl-linux-amd64.tar.gz
          ternalctl-linux-arm64.tar.gz
          ternalctl-macos-amd64.tar.gz
          ternalctl-macos-arm64.tar.gz
          ternalctl-windows-amd64.zip
          ternalctl-windows-arm64.zip'
          actual=$(jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | sort)
          test "$actual" = "$expected"
          jq -e --arg tag "$GITHUB_REF_NAME" '.isDraft == true and .tagName == $tag' "$RUNNER_TEMP/release.json" >/dev/null
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft == false' | grep -qx true
