name: Native release assets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            family: unix
            archive: ternalctl-linux-amd64.tar.gz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: unix
            archive: ternalctl-linux-arm64.tar.gz
          - platform: macos-amd64
            runner: macos-15-intel
            family: unix
            archive: ternalctl-macos-amd64.tar.gz
          - platform: macos-arm64
            runner: macos-15
            family: unix
            archive: ternalctl-macos-arm64.tar.gz
          - platform: windows-amd64
            runner: windows-2025
            family: windows
            archive: ternalctl-windows-amd64.zip
          - platform: windows-arm64
            runner: windows-11-arm
            family: windows
            archive: ternalctl-windows-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --no-self-update

      - name: Select pinned Rust toolchain
        run: rustup default 1.95.0

      - name: Install Linux native build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev patch pkg-config

      - name: Assert immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"

      - name: Build Go CLI
        if: matrix.family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/bin/ternalctl ./cmd/ternalctl

      - name: Build Go Linux agent
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/bin/ternal-agent ./cmd/ternal-agent

      - name: Build Go CLI
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/bin -Force | Out-Null
          go build -trimpath -buildvcs=false '-ldflags=-s -w -buildid=' -o dist/bin/ternalctl.exe ./cmd/ternalctl

      - name: Build and package pinned pigeons bundle
        if: matrix.family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          sh deploy/agent/build-pigeons-native.sh "${{ matrix.platform }}"
          TERNAL_TRANSPORT_BIN="dist/pigeons-${{ matrix.platform }}" \
            sh deploy/cli/package-unix.sh "${{ matrix.platform }}"
          cp "dist/${{ matrix.archive }}" "$RUNNER_TEMP/first-${{ matrix.archive }}"
          TERNAL_TRANSPORT_BIN="dist/pigeons-${{ matrix.platform }}" \
            sh deploy/cli/package-unix.sh "${{ matrix.platform }}" >/dev/null
          cmp "$RUNNER_TEMP/first-${{ matrix.archive }}" "dist/${{ matrix.archive }}"

      - name: Package Linux agent
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          agent_archive="ternal-agent-${{ matrix.platform }}.tar.gz"
          TERNAL_TRANSPORT_BIN="dist/pigeons-${{ matrix.platform }}" sh deploy/agent/package-linux-amd64.sh "${{ matrix.platform }}"
          cp "dist/$agent_archive" "$RUNNER_TEMP/first-$agent_archive"
          TERNAL_TRANSPORT_BIN="dist/pigeons-${{ matrix.platform }}" sh deploy/agent/package-linux-amd64.sh "${{ matrix.platform }}" >/dev/null
          cmp "$RUNNER_TEMP/first-$agent_archive" "dist/$agent_archive"

      - name: Qualify native archive functions
        if: matrix.family == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          set -- "${{ matrix.platform }}" "dist/${{ matrix.archive }}"
          case "${{ matrix.platform }}" in
            linux-*) set -- "$@" "dist/ternal-agent-${{ matrix.platform }}.tar.gz" ;;
          esac
          sh deploy/release/qualify-native-archives.sh "$@"

      - name: Verify Linux archive runtime baseline
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          probe="ternal-native-baseline-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.platform }}"
          owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dc() { timeout --kill-after=2s 30s docker "$@"; }
          cleanup() {
            original=$?
            trap - EXIT INT TERM HUP
            set +e
            failed=0
            ids=$(dc ps -aq --filter "name=^/$probe$") || failed=1
            if [ -n "$ids" ]; then
              label=$(dc inspect --format '{{index .Config.Labels "ternal.probe.owner"}}' "$probe")
              if [ "$label" = "$owner" ]; then dc rm --force "$probe" || failed=1; else failed=1; fi
            fi
            ids=$(dc ps -aq --filter "name=^/$probe$") || failed=1
            [ -z "$ids" ] || failed=1
            [ "$original" -eq 0 ] || exit "$original"
            exit "$failed"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM HUP
          existing=$(dc ps -aq --filter "name=^/$probe$")
          test -z "$existing"
          timeout --kill-after=5s 120s docker run --name "$probe" \
            --label "ternal.probe.owner=$owner" --rm --network none \
            -v "$PWD/dist:/archives:ro" ubuntu:24.04 sh -ec '
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"
            mkdir /probe
            cd /probe
            tar -xzf /archives/ternalctl-${{ matrix.platform }}.tar.gz
            tar -xzf /archives/ternal-agent-${{ matrix.platform }}.tar.gz
            for bundle in ternalctl-${{ matrix.platform }} ternal-agent-${{ matrix.platform }}; do
              grep -F "glibc 2.39 or newer" "$bundle/README.txt"
              "$bundle/pigeons" --help >/dev/null
              first=$("$bundle/pigeons" endpoint-id --key-dir "/probe/$bundle-keys")
              second=$("$bundle/pigeons" endpoint-id --key-dir "/probe/$bundle-keys")
              printf "%s\n" "$first" | grep -Eq "^[0-9a-f]{64}$"
              test "$first" = "$second"
            done
            agent="./ternal-agent-${{ matrix.platform }}/ternal-agent"
            "$agent" device-keygen /probe/device.key >/probe/device-public-key
            test "$(stat -c %a /probe/device.key)" = 600
            cp /probe/device.key /probe/device-before.key
            set +e
            "$agent" device-keygen /probe/device.key >/probe/repeated-keygen 2>&1
            key_status=$?
            set -e
            test "$key_status" = 1
            cmp /probe/device-before.key /probe/device.key
            set +e
            ./ternalctl-${{ matrix.platform }}/ternalctl >/tmp/cli-output 2>&1
            cli_status=$?
            ./ternal-agent-${{ matrix.platform }}/ternal-agent >/tmp/agent-output 2>&1
            agent_status=$?
            set -e
            test "$cli_status" = 1
            test "$agent_status" = 1
            grep -i usage /tmp/cli-output
            grep -i usage /tmp/agent-output
          '

      - name: Build and package pinned pigeons bundle
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          ./deploy/agent/build-pigeons-windows.ps1
          $env:TERNAL_TRANSPORT_BIN = "dist/pigeons-${{ matrix.platform }}.exe"
          ./deploy/cli/package-windows.ps1
          $first = Join-Path $env:RUNNER_TEMP "first-${{ matrix.archive }}"
          Copy-Item -LiteralPath "dist/${{ matrix.archive }}" -Destination $first
          ./deploy/cli/package-windows.ps1 | Out-Null
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash
          if ($firstHash -cne $secondHash) { throw 'Windows archive is not reproducible' }

      - name: Upload CLI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ternalctl-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux agent archive
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ternal-agent-${{ matrix.platform }}
          path: dist/ternal-agent-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30
