name: Go release candidate archives

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/native-release-assets.yml
    permissions:
      contents: read

  manifest:
    name: Bind candidate archive identity
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download Linux agent archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternal-agent-linux-amd64
          path: candidate

      - name: Download Linux amd64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-linux-amd64
          path: candidate

      - name: Download Linux arm64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-linux-arm64
          path: candidate

      - name: Download macOS amd64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-macos-amd64
          path: candidate

      - name: Download macOS arm64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-macos-arm64
          path: candidate

      - name: Download Windows amd64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-windows-amd64
          path: candidate

      - name: Download Windows arm64 CLI archive from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ternalctl-windows-arm64
          path: candidate

      - name: Verify inventory and write provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected='ternal-agent-linux-amd64.tar.gz
          ternalctl-linux-amd64.tar.gz
          ternalctl-linux-arm64.tar.gz
          ternalctl-macos-amd64.tar.gz
          ternalctl-macos-arm64.tar.gz
          ternalctl-windows-amd64.zip
          ternalctl-windows-arm64.zip'
          actual=$(find candidate -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual" = "$expected"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          candidate = pathlib.Path("candidate")
          build = dict(
              line.split("=", 1)
              for line in pathlib.Path("deploy/agent/pigeons-build.env").read_text().splitlines()
              if line and not line.startswith("#")
          )
          archive_paths = sorted(path for path in candidate.iterdir() if path.is_file())
          archives = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in archive_paths
          }
          (candidate / "candidate-sha256.txt").write_text(
              "".join(f"{digest}  {name}\n" for name, digest in archives.items())
          )
          provenance = {
              "schema": "ternal-go-release-candidate-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "expected_image": f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}:sha-{os.environ['GITHUB_SHA']}",
              "pigeons_version": build["PIGEONS_VERSION"],
              "pigeons_commit": build["PIGEONS_COMMIT"],
              "pigeons_source_sha256": build["PIGEONS_SOURCE_SHA256"],
              "pigeons_patch_sha256": hashlib.sha256(
                  pathlib.Path(f"deploy/agent/pigeons-{build['PIGEONS_VERSION']}-ternal.patch").read_bytes()
              ).hexdigest(),
              "archives": archives,
          }
          (candidate / "candidate-provenance.json").write_text(
              json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Upload exact candidate capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ternal-go-candidate-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
